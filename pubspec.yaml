name: fretix
description: Marketplace on-demand de logística para Mendoza, Argentina.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ───────────────────────────────────────────────────────────────
  firebase_core:      ^3.6.0
  firebase_auth:      ^5.3.1
  cloud_firestore:    ^5.4.3
  cloud_functions:    ^5.1.3
  firebase_messaging: ^15.1.3
  firebase_storage:   ^12.3.3     # Para upload de fotos de perfil y vehículos

  # ── Mapas y geolocalización ───────────────────────────────────────────────
  google_maps_flutter:       ^2.9.0
  geolocator:                ^13.0.1
  flutter_polyline_points:   ^2.1.0

  # ── UI / Utilidades ───────────────────────────────────────────────────────
  google_fonts:              ^6.2.1   # Fuente Inter
  cached_network_image:      ^3.4.1   # Avatares con caché
  intl:                      ^0.19.0  # Formateo de fechas y moneda ARS

  # ── Estado (liviana, sin boilerplate excesivo para este scope) ───────────
  provider:                  ^6.1.2


flutter:
  uses-material-design: true


  # Descomentar si se embebe la fuente Inter en lugar de usar google_fonts:
